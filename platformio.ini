; Lánctalpas robot – ESP8266
;
; Wemos D1 mini esetén: board = d1_mini
; NodeMCU esetén:       board = nodemcuv2
;
; Első feltöltés USB-n:   pio run -e robot -t upload
; Utána WiFi-n (OTA):     pio run -e robot_ota -t upload
;
; Az OTA IP-címe és jelszava a secrets.ini fájlban van (nincs a GitHubon).
; Másoljátok le a secrets.ini.example fájlt secrets.ini néven, és töltsétek ki.

[platformio]
extra_configs = secrets*.ini
default_envs = robot_ota

[env:robot]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:robot_ota]
extends = env:robot
upload_protocol = espota
; upload_port és upload_flags: a secrets.ini-ben